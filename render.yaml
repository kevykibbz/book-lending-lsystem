databases:
  - name: book-lending-system
    databaseName: library_system_ttx5
    user: library_system
    plan: free

services:
  - type: web
    name: book-lending-system
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: book-lending-system
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 2 # sensible default