databases:
  - name: library_system
    databaseName: library_system
    user: library_system
    plan: free

services:
  - type: web
    name: library_system
    runtime: ruby
    plan: free
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library_system
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
        value: <a sample default>
